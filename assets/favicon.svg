<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#grad)" />
  <!-- Silicon Die outline -->
  <rect x="14" y="14" width="36" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <!-- Circuit pins -->
  <line x1="8" y1="24" x2="14" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="8" y1="32" x2="14" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="8" y1="40" x2="14" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="24" x2="56" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="32" x2="56" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="40" x2="56" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="8" x2="24" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="8" x2="32" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="8" x2="40" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="50" x2="24" y2="56" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="50" x2="32" y2="56" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="50" x2="40" y2="56" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <!-- Monogram text -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">NH</text>
</svg>
